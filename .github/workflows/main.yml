
name: Build GLOBEXA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Copier GLOBEXA
        run: |
          test -f index.html
          mkdir -p www
          cp -a index.html www/
          for file in *.html; do
            if [ -f "$file" ] && [ "$file" != "index.html" ]; then
              cp -a "$file" www/
            fi
          done
          for dir in assets css js images img fonts; do
            if [ -d "$dir" ]; then
              cp -a "$dir" www/
            fi
          done

      - name: Vérifier les pages
        run: |
          test -s www/index.html
          test -s www/boutique.html
          test -s www/globexa-nouveau.html

      - name: Créer Android
        run: npx cap init GLOBEXA com.globexa.app --web-dir=www

      - name: Ajouter Android
        run: npx cap add android

      - name: Synchroniser
        run: npx cap sync android

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Vérifier APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Télécharger APK
        uses: actions/upload-artifact@v4
        with:
          name: GLOBEXA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
