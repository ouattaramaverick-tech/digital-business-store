
name: Build GLOBEXA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Préparer GLOBEXA
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            echo "<h1>GLOBEXA</h1>" > www/index.html
          fi

      - name: Créer Android
        run: npx cap init GLOBEXA com.globexa.app --web-dir=www

      - name: Ajouter Android
        run: npx cap add android

      - name: Synchroniser GLOBEXA
        run: npx cap sync android

      - name: Corriger les dépendances Kotlin
        run: |
          cat >> android/build.gradle <<'EOF'
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' &&
                          details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Télécharger APK
        uses: actions/upload-artifact@v4
        with:
          name: GLOBEXA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
